<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/capture.css')}}">

</head>
<body>
  <h1> Snack Snapshot</h1>

  <div class="section">
    <video id="video" autoplay playsinline style="display: none;"></video>
    <div class="controls">
      <button id="start_btn"> Start Camera </button>
      <button id="photo_btn" disabled> Take Photo &amp; Upload </button>
    </div>
  </div>

  <div class="section">
    <p> Or upload a photo instead:</p>
    <input type="file" id="file_input" accept="image/jpeg, image/png, image/webp">
  </div>

  <canvas id="canvas" style="display: none;"></canvas>
  <p id="status"></p>

  <div class="section">
    <h3> Captured Photo:</h3>
    <img id="photo" alt="Your photo will appear here">
  </div>

  <a href="/">Back to Dashboard</a>

  <script src="{{ url_for('static', filename='js/capture.js')}}"></script>

</body>
</html>
