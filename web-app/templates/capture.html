<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body { margin: 0 auto; padding: 40px; background: #c1fbe4 }
    video, img { display: block; width: 100%; background: #ffffff; border-radius: 8px; }
    img:not([src]) {display:none;}
    button, input {font-family: inherit; }
    .section { margin: 20px 0;}
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;}
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1> Snack Snapshot</h1>

  <div class="section">
    <video id="video" autoplay playsinline style="display: none;"></video>
    <div class="controls">
      <button id="start_btn"> Start Camera </button>
      <button id="photo_btn" disabled> Take Photo &amp; Upload </button>
    </div>
  </div>

  <div class="section">
    <p> Or upload a photo instead:</p>
    <input type="file" id="file_input" accept="image/*">
  </div>

  <canvas id="canvas" style="display: none;"></canvas>
  <p id="status"></p>

  <div class="section">
    <h3> Captured Photo:</h3>
    <img id="photo" alt="Your photo will appear here">
  </div>


  <a href="/">Back to Dashboard</a>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    const start_btn = document.getElementById('start_btn');
    const photo_btn = document.getElementById('photo_btn');
    const file_input = document.getElementById('file_input');
    const status_msg = document.getElementById('status');
    let stream = null;

    start_btn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {width: 1280, height: 720, facingMode: 'environment'},
          audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        photo_btn.disabled = false;
        status_msg.textContent = '';
      }
      catch(error){
        status_msg.textContent = 'Camera unavailable. Use localhost/HTTPS, or upload a picture';
      }
    });

    async function uploadImage(blob, filename){
      const form = new FormData();
      form.append('image', blob, filename);
      status_msg.textContent = "Uploading...";

      try{
        const r = await fetch ('/upload', { method: 'POST', body: form});
        const result = await r.json();

        if(r.ok){
          status_msg.textContent = 'Found: ' + JSON.stringify(result.counts);
        }
        else{
          status_msg.textContent = 'Error: ' + (result.error || r.status);
        }
      }
      catch(error){
        status_msg.textContent = 'Upload Failed: ' + error.message;
      }
    }

    photo_btn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      video.srcObject = null;
      photo_btn.disabled = true;
      video.style.display = 'none';

      canvas.toBlob(
        (blob) => {
          photo.src = URL.createObjectURL(blob);
          uploadImage(blob, 'capture.jpg');
        },
        'image/jpeg', 0.9
      );
      
    });

    file_input.addEventListener('change', () =>{
      if(stream){
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      video.srcObject = null;
      photo_btn.disabled = true;
      video.style.display = 'none';

      const file = file_input.files[0];
      if (file){
        photo.src = URL.createObjectURL(file);
        uploadImage(file, file.name);
      }
    });
  </script> 
</body>
</html>
