<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snack Inventory Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {margin: 0 auto; padding: 40px; background: #c1fbe4 }
    .alert {
      background: #fdf4b7;
      border: 1px solid #ff7707;
      padding: 10px;
      margin: 10px 0;
    }
    #empty { color: #666;}
    #latest_photo { max-width: 100%; }
  </style>
</head>
<body>
  <h1>Snack Inventory Tracker</h1>
  <p><a href="/capture">Take a photo</a></p>
  
  <div id="alerts"></div>
  <p id="empty" hidden> No data. Take a photo to get started. </p>

  <div id="photo_card" hidden>
    <h2> Latest Photo: </h2>
    <img id="latest_photo" alt="Recent uploaded photo">
  </div>

  <h2> Current Inventory: </h2>
  <canvas id="current_chart"></canvas>

  <h2> Inventory Over Time: </h2>
  <canvas id="history_chart"></canvas>


  <script>

    function loadPhoto(){
      const card = document.getElementById('photo_card');
      const img = document.getElementById('latest_photo');
      img.onload = () => {
        card.hidden = false;
      };
      img.onerror = () => {
        card.hidden = true;
      };
      img.src = '/latest-photo?t=' + Date.now();
    }

    async function load(){
      loadPhoto();
      const result = await fetch('/api/inventory');
      const data = await result.json();
    
      if (data.current.labels.length === 0){
        document.getElementById('empty').hidden = false;
        return;
      }

      new Chart(document.getElementById('current_chart'), {
        type: 'bar',
        data: {
          labels: data.current.labels,
          datasets: [{ label: 'Count', data: data.current.data }],
        },
      });

      new Chart(document.getElementById('history_chart'), {
        type: 'line',
        data: data.history,
      });

      const box = document.getElementById('alerts');
      box.innerHTML = '';

      if (data.low_stock.length > 0){
        box.innerHTML = `<div class="alert"> Low stock: ${data.low_stock.join(', ')}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
