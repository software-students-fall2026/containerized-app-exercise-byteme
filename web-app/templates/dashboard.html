<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snack Inventory Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css')}}">
</head>
<body>
  <h1>Snack Inventory Tracker</h1>
  <p><a href="/capture">Take a photo</a></p>
  
  <div id="alerts"></div>
  <p id="empty" hidden> No data. Take a photo to get started. </p>

  <div id="photo_card" hidden>
    <h2> Latest Photo: </h2>
    <img id="latest_photo" alt="Recent uploaded photo">
  </div>

  <h2> Current Inventory: </h2>
  <canvas id="current_chart"></canvas>

  <h2> Inventory Over Time: </h2>
  <canvas id="history_chart"></canvas>

  <script src="{{ url_for('static', filename='js/dashboard.js')}}"></script>

</body>
</html>
